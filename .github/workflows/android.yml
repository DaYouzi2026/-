name: build-android-gimbalcam

# 云台控制 + 提词 App（安卓版）独立编译
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 生成签名 keystore
        working-directory: android-app/app
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          ls -l debug.keystore

      - name: 编译 APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/release/

      - name: 改名为 GimbalCam.apk
        working-directory: android-app
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "没有APK产物"; cat build.log | tail -80; exit 1; }
          cp "$APK" GimbalCam.apk
          ls -lh GimbalCam.apk

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: GimbalCam-apk
          path: android-app/GimbalCam.apk
          if-no-files-found: error
