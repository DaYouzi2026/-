name: probe

# 临时探针：确认这台账号到底能不能拿到 runner
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "linux ok"
          uname -a
          date -u

  mac:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - run: |
          echo "mac ok"
          sw_vers
          xcodebuild -version || true
