name: build-ios

# 点 Actions 里的 Run workflow，或在网页上直接改文件触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 于 2026-11-02 退役，标签失效会让任务一创建就被取消
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 检查文件结构
        run: |
          echo "--- 仓库根目录 ---"
          ls -la
          echo "--- Tidanci/ ---"
          ls -la Tidanci
          echo "--- 资源 ---"
          find Tidanci/Assets.xcassets -type f

      - name: 装 XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # 兜底：xcodegen 一旦不认 options.xcodeVersion，还是会写成 Xcode 16 的
          # objectVersion 77，15.4 就打不开。这里强制降回 56 并打印结果。
          PBX=Tidanci.xcodeproj/project.pbxproj
          if grep -q "objectVersion = 77;" "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
            sed -i '' '/preferredProjectObjectVersion/d' "$PBX"
          fi
          grep -m1 "objectVersion" "$PBX"
          xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Tidanci.xcodeproj \
            -target Tidanci \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          APP="out/Tidanci.app"
          test -d "$APP" || { echo "没有产物，编译应该在前面就失败了"; ls -R out || true; exit 1; }
          rm -rf Payload Tidanci.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tidanci.ipa Payload
          ls -lh Tidanci.ipa
          echo "内核大小：" && du -sh Payload/Tidanci.app

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Tidanci-ipa
          path: Tidanci.ipa
          if-no-files-found: error
