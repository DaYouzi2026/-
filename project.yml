name: Tidanci
options:
  bundleIdPrefix: com.workbuddy
  # 卡死过一次：macos-14 上只有 Xcode 15.4，而最新 xcodegen 默认按 Xcode 16
  # 的 objectVersion 77 写工程文件，15.4 直接报 "future Xcode project file format"。
  # 显式声明用 15.4 生成，让它落到老格式。
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Tidanci:
    type: application
    platform: iOS
    sources:
      - path: Tidanci
    info:
      path: Tidanci/Info.plist
      properties:
        CFBundleDisplayName: 提词大师
        CFBundleShortVersionString: "1.8"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: 拍摄视频需要用到相机
        NSMicrophoneUsageDescription: 录制视频里的声音需要用到麦克风
        NSSpeechRecognitionUsageDescription: 语音跟读要用语音识别来判断你读到了哪里
        NSPhotoLibraryAddUsageDescription: 把拍好的视频存进相册
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.tidanci
        PRODUCT_NAME: Tidanci
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    scheme:
      gatherCoverageData: false
